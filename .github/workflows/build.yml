name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # release builds take their version from the tag (v1.2.3 -> 1.2.3); make
      # reads it from the environment, other builds keep the source's default
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            # static: runs on any distro, whatever its glibc
            make: make CFLAGS="-Wall -Wextra -O2 -static"
            bin: ps2-master-patcher
          - name: macos-universal
            os: macos-latest
            make: make CFLAGS="-Wall -Wextra -O2 -arch arm64 -arch x86_64"
            bin: ps2-master-patcher
          - name: windows-x64
            os: windows-latest
            msystem: MINGW64
            msys-gcc: mingw-w64-x86_64-gcc
            # static: no MinGW runtime DLLs needed
            make: make CC=gcc CFLAGS="-Wall -Wextra -O2 -static" TARGET_PS2MDBP=ps2-master-patcher.exe
            bin: ps2-master-patcher.exe
          - name: windows-x86
            os: windows-latest
            msystem: MINGW32
            msys-gcc: mingw-w64-i686-gcc
            make: make CC=gcc CFLAGS="-Wall -Wextra -O2 -static" TARGET_PS2MDBP=ps2-master-patcher.exe
            bin: ps2-master-patcher.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up MSYS2 (MinGW-w64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: make ${{ matrix.msys-gcc }}

      - name: Build
        if: runner.os != 'Windows'
        run: ${{ matrix.make }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ${{ matrix.make }}

      - name: Smoke test
        shell: bash
        run: |
          file ${{ matrix.bin }} || true
          ./${{ matrix.bin }} --version
          EXPECTED_VERSION="${VERSION#v}" python tests/smoke_test.py ${{ matrix.bin }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ps2-master-patcher-${{ matrix.name }}
          path: |
            ${{ matrix.bin }}
            README.md
            LICENSE
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Package
        run: |
          for d in ps2-master-patcher-*/; do
            (cd "$d" && zip -9 "../${d%/}.zip" ./*)
          done
          ls -la ./*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ps2-master-patcher-*.zip
          generate_release_notes: true
